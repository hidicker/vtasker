<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="VTasker">
  <title>VTasker</title>
  <!-- The mark is a competition task: a route running through three turnpoint
       cylinders, which also traces the V of VTasker. Amber marks the start
       cylinder, matching the accent used in the app. -->
  <rect width="120" height="120" rx="27" fill="#1D4ED8"/>

  <!-- optimised route between the cylinders -->
  <path d="M34 40 L60 82 L86 40"
        fill="none" stroke="#FFFFFF" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- start cylinder -->
  <circle cx="34" cy="40" r="14" fill="#1D4ED8" stroke="#FBBF24" stroke-width="6"/>
  <!-- turnpoint cylinder -->
  <circle cx="60" cy="82" r="11" fill="#1D4ED8" stroke="#FFFFFF" stroke-width="6"/>
  <!-- goal -->
  <circle cx="86" cy="40" r="11" fill="#FFFFFF"/>
</svg>
